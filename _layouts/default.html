<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>{{ page.title }}</title>
		<meta
			name="description"
			content="Loïc LeBlanc — software developer and creative technologist. Every project I still have a trace of, finished or not."
		/>
		<meta name="theme-color" content="#0d0f10" />
		<link
			rel="icon"
			type="image/png"
			href="/assets/favico/favicon-96x96.png"
			sizes="96x96"
		/>
		<link rel="icon" type="image/svg+xml" href="/assets/favico/favicon.svg" />
		<link rel="shortcut icon" href="/assets/favico/favicon.ico" />
		<link
			rel="apple-touch-icon"
			sizes="180x180"
			href="/assets/favico/apple-touch-icon.png"
		/>
		<link rel="manifest" href="/assets/favico/site.webmanifest" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
		/>
		<link rel="stylesheet" href="/assets/css/main.css?v={{ site.time | date: '%s' }}" />
	</head>
	<body>
		<header class="site-header">
			<div class="container">
				<a href="/" class="brand">
					<img src="/assets/Cube.png" alt="" />
					<span>Omnium Artifactorum</span>
				</a>
				<nav class="site-nav">
					<a href="/#projects">Projects</a>
					<a href="https://github.com/OverseeingDev" target="_blank" rel="noopener">GitHub</a>
					<a href="https://gitlab.com/overseer108" target="_blank" rel="noopener">GitLab</a>
				</nav>
			</div>
		</header>

		<main>
			<div class="container">{{ content }}</div>
		</main>

		<footer class="site-footer">
			<div class="container">
				<p>&copy; {{ site.time | date: '%Y' }} Loïc LeBlanc. All rights reserved.</p>
			</div>
		</footer>
	</body>
</html>
